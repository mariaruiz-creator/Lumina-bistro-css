<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Bistrô - Reservas</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
     
    <header>
        <h1>Lumina Bistrô</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="reservas.html">Reservas</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="contato.html">Contato</a>
        </nav>
        <br>
    </header>

     <section id="reservas">
    <h2>Reserve a sua mesa e aproveite sua experiência!</h2>
    
    <form action="#" method="POST" class="formulario">
        <div class="campo">
            <label for="nome" class="rotulo">Nome Completo:</label>
            <input type="text" id="nome" name="nome" class="entrada" placeholder="Seu nome completo">
        </div>

        <div class="campo">
            <label for="email" class="rotulo">Email:</label>
            <input type="email" id="email" name="email" class="entrada" placeholder="seu@email.com">
        </div>

        <div class="campo">
            <label for="telefone" class="rotulo">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" class="entrada" placeholder="(17) 99999-9999">
        </div>

        <!-- Data e Hora em caixas lado a lado -->
        <div class="campo-duplo">
            <div class="campo">
                <label for="data" class="rotulo">Data:</label>
                <input type="date" id="data" name="data" class="entrada">
            </div>

            <div class="campo">
                <label for="hora" class="rotulo">Horário:</label>
                <input type="time" id="hora" name="hora" class="entrada">
            </div>
        </div>

        <div class="campo">
            <label for="lugares" class="rotulo">Quantos lugares deseja:</label>
            <select id="lugares" name="lugares" class="entrada">
                <option value="">Selecione uma opção</option>
                <option value="1">1 Pessoa</option>
                <option value="2">2 Pessoas</option>
                <option value="4">4 Pessoas</option>
                <option value="6">6 ou mais pessoas</option>
            </select>
        </div>

        <button type="submit" class="botao-enviar">Confirmar Reserva!</button>
    </form>
</section>
</html>
